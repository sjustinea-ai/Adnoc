<script>
// Database dasar nama bengkel/toko, diambil dari file Excel "Daftar Nama Pelanggan dan Pivot.xlsx"
const WORKSHOP_DATABASE = ["ABDUL SPEED AKA FAJAR MOTOR", "AEREMAP BANDUNG", "AGNIA MOTOR", "ASHIFA MOTOR", "ATHUNK GARAGE", "B PERFORMANCE", "BAITECH", "BIB MOTOR", "BULL GARAGE", "CENTRAL AUTOPART", "CEPS PERFORMANCE", "CETTA GARAGE", "D&S AUTO SERVICE", "DEUS MOTOSHOP X BMB", "FAJAR MOTOR", "GARAGE SERVICE & REPAIR", "GRIYA AUTO PEUGEOT BMW", "HELDA JAYA MOTOR", "JAVA NUSANTARA", "KEBON SAWIT GARAGE", "KEMBAR JAYA MOTOR (JABAR)", "MAJU MOTOR", "MG MANUAL TECH", "MIT GARAGE", "MOBILINDO BMW", "NEXT PRIMA BMW", "OTOMART", "PAMMA", "Q STATION MOTOR", "R2 RACING (BANDUNG)", "SCOOTER HOUSE DJAKARTA (SHD BDG)", "SONICS ENGINEERING", "STR GARAGE", "SUNDA FORTUNA", "SURYA JAYA MOTOR", "UNCLE 908 GARAGE", "VAL CHEVY", "VOLCANO MOTORSPORT"];

// Kunci penyimpanan nama bengkel baru yang ditambahkan lewat aplikasi (persisten di browser ini)
const WORKSHOP_EXTRA_KEY = "workshopExtraDB";

function getExtraWorkshops(){
  try{ return JSON.parse(localStorage.getItem(WORKSHOP_EXTRA_KEY) || "[]"); }
  catch(e){ return []; }
}

function getAllWorkshops(){
  let extra = getExtraWorkshops();
  let all = [...WORKSHOP_DATABASE, ...extra];
  // Hilangkan duplikat (tidak peka huruf besar/kecil), lalu urutkan A-Z
  let seen = new Set(), unique = [];
  all.forEach(n=>{
    let key = String(n).trim().toLowerCase();
    if(key && !seen.has(key)){ seen.add(key); unique.push(String(n).trim()); }
  });
  return unique.sort((a,b)=>a.localeCompare(b,"id"));
}

function renderWorkshopList(){
  let info = document.getElementById("workshopDbInfo");
  if(info) info.textContent = `Database bengkel: ${getAllWorkshops().length} nama tersimpan`;
  filterWorkshopSelect();
}

function filterWorkshopSelect(){
  let sel = document.getElementById("workshopSelect");
  if(!sel) return;
  let q = String(document.getElementById("workshop") ? document.getElementById("workshop").value : "").trim().toLowerCase();
  let list = getAllWorkshops().filter(n=>!q || n.toLowerCase().includes(q));
  sel.innerHTML = '<option value="">-- Pilih Bengkel dari Database --</option>'
    + list.map(n=>`<option value="${String(n).replace(/"/g,"&quot;")}">${n}</option>`).join("");
}

function addWorkshopIfNew(name){
  name = String(name||"").trim();
  if(!name) return;
  let all = getAllWorkshops();
  let exists = all.some(n=>n.toLowerCase()===name.toLowerCase());
  if(!exists){
    let extra = getExtraWorkshops();
    extra.push(name);
    localStorage.setItem(WORKSHOP_EXTRA_KEY, JSON.stringify(extra));
    renderWorkshopList();
  }
}
</script>
</head>

const $=id=>document.getElementById(id);
function today(){let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
$("date").value=today();$("month").value=today().slice(0,7);
function populateProducts(filter=""){
  let q=String(filter||"").trim().toLowerCase();
  let names=[...new Set(DB.map(x=>x.name))].filter(n=>!q||n.toLowerCase().includes(q));
  $("search").innerHTML='<option value="">-- Pilih Barang --</option>'+names.map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n}</option>`).join("");
}
$("productFilter").addEventListener("input",()=>populateProducts($("productFilter").value));
$("workshopSelect").addEventListener("change",()=>{ if($("workshopSelect").value){ $("workshop").value=$("workshopSelect").value; } });

$("sae").addEventListener("change",updatePrice);
$("pack").addEventListener("change",updatePrice);
$("unit").addEventListener("change",updatePrice);
function matches(){
  let q=String($("search").value||"").trim().toLowerCase();
  return q?DB.filter(x=>x.name.toLowerCase()===q):[];
}
function loadProduct(){
  let m=matches();
  $("sae").innerHTML=m.length?[...new Set(m.map(x=>x.sae))].map(x=>`<option>${x}</option>`).join(""):'<option value="">-- Pilih SAE --</option>';
  $("pack").innerHTML=m.length?[...new Set(m.map(x=>x.pack))].map(x=>`<option>${x}</option>`).join(""):'<option value="">-- Pilih Pack --</option>';
  updatePrice();
}
function packQty(pack){let m=String(pack||"").match(/^(\d+)\s*[xX]/);return m?Number(m[1]):1}
function updateUnitUI(){let u=$("unit").value;$("qtyLabel").textContent=u==="pcs"?"Jumlah PCS":"Jumlah Dus";$("qty").step=u==="pcs"?"1":"0.01";$("qty").min=u==="pcs"?"1":"0.01"}
function updatePrice(){
  let m=matches();
  let x=m.find(a=>a.sae===$("sae").value&&a.pack===$("pack").value)||m[0];
  let u=$("unit").value;
  updateUnitUI();
  if(x){
    let n=packQty(x.pack);
    let unitPrice=u==="pcs"?x.price/n:x.price;
    $("price").value=rupiah(unitPrice);
    $("packSize").value=n+" PCS/DUS";
    $("hint").textContent=`${x.name} • ${x.sae} • ${x.pack} • Harga ${u.toUpperCase()}: ${rupiah(unitPrice)}`;
  }else{
    $("price").value="";
    $("packSize").value="";
    $("hint").textContent="";
  }
}
function rupiah(n){return "Rp "+Math.round(Number(n)||0).toLocaleString("id-ID")}
function getDiscounts(){
  return [1,2,3,4,5].map(i=>Number($("disc"+i).value)||0).filter(v=>v>0);
}
function calcDiscount(price, discounts){
  let current=Number(price)||0, steps=[];
  discounts.forEach((p,i)=>{
    let before=current, amount=before*p/100;
    current=before-amount;
    steps.push({no:i+1,p,before,amount,after:current});
  });
  return {final:current,steps};
}
function updateDiscountPreview(){
  let price=Number((($("price").value||"").replace(/[^0-9.]/g,""))||0);
  let ds=getDiscounts();
  if(!price){$("discountPreview").textContent="";return}
  let c=calcDiscount(price,ds);
  $("discountPreview").innerHTML=c.steps.length
    ? c.steps.map(s=>`Disc ${s.p}%: -${rupiah(s.amount)} → ${rupiah(s.after)}`).join("<br>")+`<br><b>Harga akhir: ${rupiah(c.final)}</b>`
    : `<b>Harga akhir: ${rupiah(price)}</b>`;
}
["disc1","disc2","disc3","disc4","disc5"].forEach(id=>$(`${id}`).addEventListener("input",updateDiscountPreview));
function addItem(){
  let m=matches(),x=m.find(a=>a.sae===$("sae").value&&a.pack===$("pack").value)||m[0],q=Number($("qty").value);
  let discounts=getDiscounts(),u=$("unit").value;
  if(!x||!q||q<=0){alert("Pilih barang dan jumlah.");return}
  if(u==="pcs"&&!Number.isInteger(q)){alert("Jumlah PCS harus bilangan bulat.");return}
  let orderPrice=u==="pcs"?x.price:x.price*packQty(x.pack);
  let c=calcDiscount(orderPrice,discounts);
  items.push({...x,unit:u,qty:q,packQty:packQty(x.pack),orderPrice,discounts,finalPrice:c.final,total:c.final*q});
  renderItems();
}
function renderItems(){
  $("items").innerHTML=items.map((x,i)=>{
    let c=calcDiscount(x.orderPrice??x.price,x.discounts||[]);
    return `<div class="item">
      <b>${x.name}</b>
      <span class="muted">${x.sae} • ${x.pack} • ${x.qty} ${x.unit.toUpperCase()}</span>
      <div class="muted" style="margin-top:6px">Isi dus: ${x.packQty||packQty(x.pack)} PCS • Diskon: ${(x.discounts||[]).map(v=>v+"%").join(" + ")||"-"}</div>
      <div class="muted">${c.steps.map(s=>`Disc ${s.p}%: -${rupiah(s.amount)} → ${rupiah(s.after)}`).join("<br>")||"Tanpa diskon"}</div>
      <b style="margin-top:5px">Harga akhir: ${rupiah(c.final)}/${x.unit} • Total: ${rupiah(c.final*x.qty)}</b>
      <button class="red" style="float:right;margin-top:-25px" onclick="items.splice(${i},1);renderItems()">Hapus</button>
    </div>`
  }).join("")||'<div class="muted">Belum ada barang.</div>';
}
function clearItems(){items=[];renderItems()}
function dateText(v){let d=new Date(v+"T00:00:00");return d.toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"2-digit",year:"2-digit"})}
function packLabel(pack){
  let m=String(pack||"").match(/X([^X]+)$/i);
  if(!m)return "";
  let s=m[1].toUpperCase().replace(/ML$/," ML").replace(/L$/," L").replace(/GRAM$/," GRAM");
  s=s.replace(/(\d+)\.(\d+)/g,"$1,$2");
  return s.trim();
}
function makeOutput(){
  if(!items.length){alert("Tambahkan barang terlebih dahulu.");return ""}

  let lines=items.map(x=>{
    let unitLabel=(x.unit||"dus").toLowerCase();
    let name=(x.name||"").replace(/^ADNOC\s+/i,"");
    let sae=x.sae ? ` ${x.sae}` : "";
    let size=packLabel(x.pack);
    let sizeText=size ? ` ${size}` : "";
    return `*${name}${sae}${sizeText} ${x.qty} ${unitLabel}*`;
  }).join("\n");

  let ds=[...new Set(items.flatMap(x=>x.discounts||[]))];
  let discText=ds.length ? ds.join("% + ")+"%" : "-";

  let out=`FORM ORDER: 

${dateText($("date").value)}

NAMA SALES :
${$("sales").value}

AREA : ${$("area").value}

NAMA BENGKEL: 
${$("workshop").value}

SALES ORDER :

${lines}

DISC : ${discText}

function exportRecapToExcel(){
  const month = $("month").value;
  if(!month){ alert("Pilih bulan rekap terlebih dahulu."); return; }

  const all = JSON.parse(localStorage.getItem("noo2") || "[]");
  const rows = all.filter(x => String(x.date || "").startsWith(month));
  if(!rows.length){
    alert("Tidak ada data rekap pada bulan yang dipilih.");
    return;
  }

  // Pivot bulanan: satu baris = satu toko/bengkel unik.
  // Produk berbeda pada toko yang sama digabung ke kolom produk masing-masing.
  const normalize = v => String(v || "").trim().replace(/\s+/g," ").toLowerCase();
  const money = n => Math.round(Number(n) || 0);

  const stores = new Map();
  const productKeys = new Map();

  rows.forEach(x => {
    const workshop = String(x.workshop || "").trim() || "(Tanpa Nama Bengkel)";
    const storeKey = normalize(workshop);

    const productLabel = [
      String(x.product || "").replace(/^ADNOC\s+/i,"").trim(),
      x.sae || "",
      x.pack || "",
      String(x.unit || "dus").toUpperCase()
    ].filter(Boolean).join(" • ");

    const pKey = normalize(productLabel);
    if(!productKeys.has(pKey)) productKeys.set(pKey, productLabel);

    if(!stores.has(storeKey)){
      stores.set(storeKey,{
        workshop,
        sales:new Set(),
        area:new Set(),
        products:new Map(),
        totalQty:0,
        totalValue:0
      });
    }

    const st = stores.get(storeKey);
    if(x.sales) st.sales.add(String(x.sales).trim());
    if(x.area) st.area.add(String(x.area).trim());

    const qty = Number(x.qty) || 0;
    const unit = String(x.unit || "dus").toUpperCase();

    if(!st.products.has(pKey)) st.products.set(pKey,{qty:0,units:new Set()});
    const pr = st.products.get(pKey);
    pr.qty += qty;
    pr.units.add(unit);

    st.totalQty += qty;
    st.totalValue += money(x.total != null ? x.total : ((x.finalPrice || x.price || 0) * qty));
  });

  const productList = [...productKeys.entries()];
  const header = [
    "Bulan","Nama Bengkel","Sales","Area",
    ...productList.map(([k,label]) => label),
    "Total Qty","Total Nilai"
  ];
  const data = [header];

  for(const st of stores.values()){
    const row = [
      month,
      st.workshop,
      [...st.sales].filter(Boolean).join(", "),
      [...st.area].filter(Boolean).join(", ")
    ];

    productList.forEach(([pKey]) => {
      const pr = st.products.get(pKey);
      if(!pr) row.push("");
      else {
        const q = Number.isInteger(pr.qty) ? pr.qty : Number(pr.qty.toFixed(2));
        row.push(`${q} ${[...pr.units].join("/")}`);
      }
    });

    row.push(Number.isInteger(st.totalQty) ? st.totalQty : Number(st.totalQty.toFixed(2)));
    row.push(st.totalValue);
    data.push(row);
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(data);

  const totalCol = header.length - 1;
  for(let r=1; r<data.length; r++){
    const cell = ws[XLSX.utils.encode_cell({r:r,c:totalCol})];
    if(cell) cell.z = '#,##0';
  }

  ws["!cols"] = header.map((h,i) => ({
    wch: i < 4
      ? Math.min(Math.max(String(h).length + 3, 14), 28)
      : Math.min(Math.max(String(h).length + 2, 12), 32)
  }));

  ws["!autofilter"] = {
    ref: XLSX.utils.encode_range({
      s:{r:0,c:0}, e:{r:data.length-1,c:header.length-1}
    })
  };

  XLSX.utils.book_append_sheet(wb, ws, "Rekap Bulanan");
  XLSX.writeFile(wb, `Rekap_Bulanan_ADNOC_${month.replace("-","_")}.xlsx`);

  alert(`Rekap berhasil diekspor: ${stores.size} toko unik dari ${rows.length} baris order digabung seperti pivot.`);
}

function exportWorkshopDbToExcel(){
  const bawaan = [...WORKSHOP_DATABASE].sort((a,b)=>a.localeCompare(b,"id"));
  const tambahan = getExtraWorkshops()
    .map(n=>String(n).trim())
    .filter(n=>n && !bawaan.some(b=>b.toLowerCase()===n.toLowerCase()));
  const semua = getAllWorkshops();

  if(!semua.length){
    alert("Database bengkel masih kosong.");
    return;
  }

  const wb = XLSX.utils.book_new();

  // Sheet 1: semua nama bengkel (gabungan, terurut A-Z, tanpa duplikat)
  const dataSemua = [["Nama Bengkel"], ...semua.map(n=>[n])];
  const wsSemua = XLSX.utils.aoa_to_sheet(dataSemua);
  wsSemua["!cols"] = [{ wch: 40 }];
  XLSX.utils.book_append_sheet(wb, wsSemua, "Semua Nama Bengkel");

  // Sheet 2: hanya nama baru yang ditambahkan lewat aplikasi ini
  const dataBaru = [["Nama Bengkel Baru (Ditambahkan Lewat Aplikasi)"], ...tambahan.map(n=>[n])];
  const wsBaru = XLSX.utils.aoa_to_sheet(dataBaru);
  wsBaru["!cols"] = [{ wch: 45 }];
  XLSX.utils.book_append_sheet(wb, wsBaru, "Bengkel Baru");

  const today = new Date();
  const stamp = today.toISOString().slice(0,10).replace(/-/g,"");
  XLSX.writeFile(wb, `Database_Bengkel_ADNOC_${stamp}.xlsx`);

  alert(`Database bengkel berhasil diekspor: ${semua.length} nama total (${tambahan.length} nama baru).`);
}</script>
